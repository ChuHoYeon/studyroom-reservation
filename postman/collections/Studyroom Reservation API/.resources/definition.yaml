$kind: collection
description: |-
  Spring Boot 기반 스터디룸 예약 서비스 API 컬렉션입니다.

  스터디룸 조회와 시간대별 예약, 예약 취소를 제공합니다.  
  사용자는 원하는 시간의 스터디룸을 예약하고,  
  관리자는 공간 정보와 예약 현황을 관리할 수 있습니다.

  대부분의 API는 JWT Bearer 토큰 인증이 필요합니다.  
  /health 및 /auth/** 엔드포인트는 인증 없이 접근 가능합니다.
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
variables:
  baseUrl: http://localhost:8080
  accessToken: ""
  verificationToken: ""
